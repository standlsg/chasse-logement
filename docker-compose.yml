services:
  chasse-logement:
    build: .
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    command:
      [
        "chasse-logement",
        "serve",
        "--config",
        "/app/config.yaml",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8000:8000"
    restart: unless-stopped
